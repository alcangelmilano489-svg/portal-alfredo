<!-- SCRIPT DE JAVASCRIPT -->
    <script>
        function navegarSeccion(hash) {
            var secciones = document.querySelectorAll('.seccion-fija');
            var mainContent = document.querySelector('.contenido-principal');
            var carrusel = document.querySelector('.carrusel-container');
            var seccionEncontrada = false;

            secciones.forEach(function(s) {
                if (s.id === hash) {
                    s.classList.add('active');
                    seccionEncontrada = true;
                } else {
                    s.classList.remove('active');
                }
            });

            if (!seccionEncontrada) {
                if (mainContent) mainContent.classList.add('active');
                if (carrusel) carrusel.style.display = 'block';
            } else {
                if (mainContent) mainContent.classList.remove('active');
                if (carrusel) carrusel.style.display = 'none';
            }

            if (seccionEncontrada) {
                var sec = document.getElementById(hash);
                if (sec) sec.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function activarTab(element) {
            document.querySelectorAll('.menu-navegacion a').forEach(function(a) {
                a.classList.remove('tab-activo');
            });
            element.classList.add('tab-activo');
        }

        var tiposReaccion = ['like', 'love', 'haha', 'wow', 'sad', 'angry'];
        var emojisReaccion = { like: '👍', love: '❤️', haha: '😂', wow: '😮', sad: '😢', angry: '😡' };
        var labelsReaccion = { like: 'Me gusta', love: 'Me encanta', haha: 'Me divierte', wow: 'Me sorprende', sad: 'Me entristece', angry: 'Me enoja' };

        function cargarReacciones(postId) {
            var key = 'post_' + postId + '_reacciones';
            var defaults = {};
            tiposReaccion.forEach(function(t) { defaults[t] = 0; });
            defaults.userReaccion = null;
            return Object.assign(defaults, JSON.parse(localStorage.getItem(key) || '{}'));
        }

        function guardarReacciones(postId, data) {
            localStorage.setItem('post_' + postId + '_reacciones', JSON.stringify(data));
        }

        function toggleReaccion(postId, tipo) {
            var data = cargarReacciones(postId);
            if (data.userReaccion === tipo) {
                data[tipo]--;
                data.userReaccion = null;
            } else {
                if (data.userReaccion) data[data.userReaccion]--;
                data[tipo]++;
                data.userReaccion = tipo;
            }
            guardarReacciones(postId, data);
            renderizarReacciones(postId);
        }

        function renderizarReacciones(postId) {
            var data = cargarReacciones(postId);
            var contenedor = document.getElementById('reacciones-' + postId);
            if (!contenedor) return;

            contenedor.innerHTML = tiposReaccion.map(function(tipo) {
                var activa = data.userReaccion === tipo;
                var clase = activa ? 'btn-reaccion activo' : 'btn-reaccion';
                return '<button onclick="toggleReaccion(\'' + postId + '\', \'' + tipo + '\')" class="' + clase + '" title="' + labelsReaccion[tipo] + '">' +
                    emojisReaccion[tipo] + ' ' + data[tipo] +
                '</button>';
            }).join('');
        }

        function cargarComentarios(postId) {
            return JSON.parse(localStorage.getItem('post_' + postId + '_comentarios') || '[]');
        }

        function guardarComentarios(postId, comentarios) {
            localStorage.setItem('post_' + postId + '_comentarios', JSON.stringify(comentarios));
        }

        function agregarComentario(postId) {
            var input = document.getElementById('input-comentario-' + postId);
            var texto = input.value.trim();
            if (texto === "") {
                alert("Por favor escribe un comentario antes de publicar.");
                return;
            }
            var comentarios = cargarComentarios(postId);
            comentarios.push({
                texto: texto,
                fecha: new Date().toLocaleDateString(),
                hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            guardarComentarios(postId, comentarios);
            input.value = "";
            renderizarComentarios(postId);
        }

        function renderizarComentarios(postId) {
            var lista = document.getElementById('lista-comentarios-' + postId);
            var spanContador = document.getElementById('num-comentarios-' + postId);
            if (!lista) return;

            var comentarios = cargarComentarios(postId);
            lista.innerHTML = comentarios.map(function(c) {
                return '<div class="comentario-item">' +
                    '<strong>Visitante:</strong>' +
                    '<p style="margin: 3px 0 0 0; color: #334155; font-size: 13px;">' + c.texto + '</p>' +
                    '<small>' + c.fecha + ' ' + c.hora + '</small>' +
                '</div>';
            }).join('');

            if (spanContador) spanContador.textContent = comentarios.length;
        }

        // --- FUNCIÓN MODIFICADA PARA CONSULTAR EL SERVIDOR / SUPABASE ---
        async function renderizarNoticias() {
            var contenedor = document.getElementById('contenedor-noticias-admin');
            if (!contenedor) return;

            contenedor.innerHTML = '<p class="mensaje-vacio">Cargando publicaciones del servidor...</p>';

            try {
                // Hacemos la petición a la API de Flask que trae los datos de Supabase
                let response = await fetch('/api/publicaciones'); 
                let data = await response.json();
                
                var noticiasAdmin = data.success ? data.publicaciones : [];

                if (!noticiasAdmin || noticiasAdmin.length === 0) {
                    contenedor.innerHTML = '<p class="mensaje-vacio">No hay publicaciones recientes en este momento.</p>';
                    return;
                }

                var htmlTotal = '';
                for (var i = 0; i < noticiasAdmin.length; i++) {
                    var n = noticiasAdmin[i];
                    var tituloLimpio = 'post';
                    if (n.titulo) {
                        tituloLimpio = n.titulo.replace(/\s+/g, '_');
                    }
                    var postId = n.id || (tituloLimpio + '_' + i);

                    var html = '<div class="post-card">' +
                        '<div class="post-header">' +
                            '<span class="post-badge">Publicación</span>' +
                            '<span class="post-date">' + (n.fecha || '') + '</span>' +
                        '</div>' +
                        '<h3>' + (n.titulo || '') + '</h3>' +
                        '<p class="post-texto">' + (n.texto || '') + '</p>';

                    if (n.mediaUrl || n.mediaType) {
                        let rutaFinal = n.mediaUrl;
                        if (n.mediaType === 'video' || (rutaFinal && (rutaFinal.endsWith('.mp4') || rutaFinal.endsWith('.mov') || rutaFinal.endsWith('.avi') || rutaFinal.endsWith('.mkv')))) {
                            html += '<video src="' + rutaFinal + '" controls class="post-media-video" style="width:100%; border-radius:8px; margin-top:10px;"></video>';
                        } else {
                            html += '<img src="' + rutaFinal + '" alt="Publicacion" class="post-media-img" style="width:100%; border-radius:8px; margin-top:10px;">';
                        }
                    }

                    html += '<div id="reacciones-' + postId + '" class="reacciones-container"></div>' +
                            '<div class="seccion-comentarios-post">' +
                                '<span class="label-comentarios">💬 <span id="num-comentarios-' + postId + '">0</span> comentarios</span>' +
                                '<div id="lista-comentarios-' + postId + '" class="lista-comentarios"></div>' +
                                '<div class="form-comentario">' +
                                    '<input type="text" id="input-comentario-' + postId + '" placeholder="Escribe un comentario..." class="input-comentario">' +
                                    '<button onclick="agregarComentario(\'' + postId + '\')" class="btn-comentar">Comentar</button>' +
                                '</div>' +
                            '</div>' +
                        '</div>';
                    htmlTotal += html;
                }

                contenedor.innerHTML = htmlTotal;

                for (var j = 0; j < noticiasAdmin.length; j++) {
                    var nItem = noticiasAdmin[j];
                    var tituloItemLimpio = 'post';
                    if (nItem.titulo) {
                        tituloItemLimpio = nItem.titulo.replace(/\s+/g, '_');
                    }
                    var pId = nItem.id || (tituloItemLimpio + '_' + j);
                    renderizarReacciones(pId);
                    renderizarComentarios(pId);
                }

            } catch (error) {
                console.error("Error al cargar publicaciones:", error);
                contenedor.innerHTML = '<p class="mensaje-vacio" style="color: red;">Error al conectar con el servidor para cargar las publicaciones.</p>';
            }
        }

        function enviarMensajeContacto(event) {
            event.preventDefault();
            document.getElementById('mensaje-exito').style.display = 'block';
            document.getElementById('form-contacto').reset();
            setTimeout(function() {
                document.getElementById('mensaje-exito').style.display = 'none';
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderizarNoticias();
        });
    </script>
