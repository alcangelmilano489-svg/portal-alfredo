<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <style>
        body { background-color: #f1f5f9; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .admin-header { background: #1e3a8a; color: white; padding: 20px; text-align: center; }
        .admin-container { max-width: 850px; margin: 30px auto; padding: 0 15px; }
        .admin-card { background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .admin-card h2 { margin-top: 0; color: #1e3a8a; font-size: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #334155; font-size: 14px; }
        textarea, input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 120px; resize: vertical; }
        .btn-actualizar { background: #2563eb; color: white; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-actualizar:hover { background: #1d4ed8; }
        .btn-eliminar { background: #ef4444; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .btn-eliminar:hover { background: #dc2626; }
        #pantalla-login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: #ffffff; padding: 30px; border-radius: 12px; width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .item-lista { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 15px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- PANTALLA DE ACCESO -->
    <div id="pantalla-login">
        <div class="login-box">
            <h2>🔒 ACCESO RESTRINGIDO</h2>
            <label for="input-clave" style="text-align: left;">Contraseña</label>
            <input type="password" id="input-clave" placeholder="Ingrese su clave">
            <button onclick="verificarClave()" style="width: 100%; background-color: #0b1f4d; padding: 10px; cursor: pointer; color: white; border: none; border-radius: 5px; font-weight: bold;">Ingresar al Panel</button>
            <p id="error-clave" style="color: #ef4444; font-size: 13px; display: none;">Contraseña incorrecta.</p>
        </div>
    </div>

    <!-- PANEL DE ADMINISTRACIÓN PRINCIPAL -->
    <div id="panel-contenido" style="display: none;">
        <div class="admin-header">
            <h1>Panel de Administración</h1>
            <p style="margin: 5px 0 0 0; font-size: 14px; color: #93c5fd;">Gestión de contenidos del portal</p>
        </div>

        <div class="admin-container">

            <!-- 1. SECCIÓN INICIO -->
            <div class="admin-card">
                <h2>🏠 Publicaciones generales (Inicio)</h2>
                <label for="admin-titulo">Título:</label>
                <input type="text" id="admin-titulo" placeholder="Título de la publicación...">
                <label for="admin-texto-inicio">Contenido:</label>
                <textarea id="admin-texto-inicio" placeholder="Escribe el mensaje o noticia..."></textarea>
                <label for="admin-archivo-inicio">Adjuntar Imagen o Video opcional:</label>
                <input type="file" id="admin-archivo-inicio" accept="image/*,video/*">
                <button class="btn-actualizar" onclick="publicarInicio(event)">Publicar en Inicio</button>
            </div>

            <!-- 2. SECCIÓN VIDA -->
            <div class="admin-card">
                <h2>📖 Sección Vida</h2>
                <label for="admin-titulo-vida">Título / Subtítulo:</label>
                <input type="text" id="admin-titulo-vida" placeholder="Título de la etapa o biografía...">
                <label for="admin-texto-vida">Contenido biográfico:</label>
                <textarea id="admin-texto-vida" placeholder="Escribe la historia o detalles de su vida..."></textarea>
                <label for="admin-archivo-vida">Adjuntar Imagen ilustrativa opcional:</label>
                <input type="file" id="admin-archivo-vida" accept="image/*">
                <button class="btn-actualizar" onclick="publicarSeccionEspecifica('vida', event)">Publicar en Vida</button>
            </div>

            <!-- 3. SECCIÓN OBRA -->
            <div class="admin-card">
                <h2>📚 Sección Obra</h2>
                <label for="admin-titulo-obra">Título de la obra:</label>
                <input type="text" id="admin-titulo-obra" placeholder="Título de la obra...">
                <label for="admin-texto-obra">Descripción / Contenido:</label>
                <textarea id="admin-texto-obra" placeholder="Escribe la descripción de la obra..."></textarea>
                <label for="admin-archivo-obra">Adjuntar Archivo o Imagen opcional:</label>
                <input type="file" id="admin-archivo-obra" accept="image/*,.pdf">
                <button class="btn-actualizar" onclick="publicarSeccionEspecifica('obra', event)">Publicar en Obra</button>
            </div>

            <!-- 4. SECCIÓN FOTOS -->
            <div class="admin-card">
                <h2>📷 Sección Fotos (Galería)</h2>
                <input type="file" id="admin-foto-archivo" accept="image/*">
                <input type="text" id="admin-foto-nombre" placeholder="Título o descripción de la foto">
                <button class="btn-actualizar" onclick="subirMultimedia('fotos', 'admin-foto-archivo', 'admin-foto-nombre', 'image', event)">Subir Foto a la Galería</button>
            </div>

            <!-- 5. SECCIÓN VIDEOS -->
            <div class="admin-card">
                <h2>🎥 Sección Videos</h2>
                <input type="file" id="admin-video-archivo" accept="video/*">
                <input type="text" id="admin-video-nombre" placeholder="Título del video">
                <button class="btn-actualizar" onclick="subirMultimedia('videos', 'admin-video-archivo', 'admin-video-nombre', 'video', event)">Subir Video</button>
            </div>

            <!-- GESTOR GENERAL DE ELEMENTOS -->
            <div class="admin-card">
                <h2>⚙️ Gestionar Publicaciones Activas</h2>
                <div id="lista-admin-inicio">
                    <p style="color: #64748b; font-size: 14px;">Cargando...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        let adminPassword = '';

        function escaparHtmlAdmin(valor) {
            return String(valor == null ? '' : valor).replace(/[&<>"']/g, function(caracter) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[caracter];
            });
        }

        async function verificarClave() {
            let ingresada = document.getElementById('input-clave').value;
            let mensajeError = document.getElementById('error-clave');
            mensajeError.style.display = 'none';

            try {
                const response = await fetch('/api/admin/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: ingresada })
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    mensajeError.textContent = result.error || 'No se pudo validar el acceso.';
                    mensajeError.style.display = 'block';
                    return;
                }

                adminPassword = ingresada;
                document.getElementById('input-clave').value = '';
                document.getElementById('pantalla-login').style.display = 'none';
                document.getElementById('panel-contenido').style.display = 'block';
                await actualizarListaInicio();
            } catch (error) {
                mensajeError.textContent = 'No se pudo conectar con el servidor.';
                mensajeError.style.display = 'block';
            }
        }

        async function publicarInicio(eventRef) {
            let titulo = document.getElementById('admin-titulo').value.trim();
            let texto = document.getElementById('admin-texto-inicio').value.trim();
            let inputArchivo = document.getElementById('admin-archivo-inicio');

            if (!titulo && !texto && (!inputArchivo.files || !inputArchivo.files[0])) {
                alert("Debes rellenar al menos un título, texto o adjuntar un archivo.");
                return;
            }

            const btn = eventRef.target;
            let original = btn.textContent;
            btn.textContent = "Procesando...";
            btn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('titulo', titulo);
                formData.append('texto', texto);
                formData.append('seccion', 'inicio');
                if (inputArchivo.files && inputArchivo.files[0]) {
                    formData.append('file', inputArchivo.files[0]);
                }

                const response = await fetch('/api/publicaciones', {
                    method: 'POST',
                    headers: { 'X-Admin-Password': adminPassword },
                    body: formData
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'No se pudo guardar la publicación.');
                }

                document.getElementById('admin-titulo').value = "";
                document.getElementById('admin-texto-inicio').value = "";
                inputArchivo.value = "";

                alert("¡Publicación guardada con éxito!");
                await actualizarListaInicio();

            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.textContent = original;
                btn.disabled = false;
            }
        }

        async function publicarSeccionEspecifica(nombreSeccion, eventRef) {
            let tituloId = 'admin-titulo-' + nombreSeccion;
            let textoId = 'admin-texto-' + nombreSeccion;
            let archivoId = 'admin-archivo-' + nombreSeccion;

            let titulo = document.getElementById(tituloId).value.trim();
            let texto = document.getElementById(textoId).value.trim();
            let inputArchivo = document.getElementById(archivoId);

            if (!titulo && !texto && (!inputArchivo.files || !inputArchivo.files[0])) {
                alert("Debes rellenar al menos un título, texto o adjuntar un archivo para la sección " + nombreSeccion + ".");
                return;
            }

            const btn = eventRef.target;
            let original = btn.textContent;
            btn.textContent = "Procesando...";
            btn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('titulo', titulo);
                formData.append('texto', texto);
                formData.append('seccion', nombreSeccion); // Envía 'vida' u 'obra'
                if (inputArchivo.files && inputArchivo.files[0]) {
                    formData.append('file', inputArchivo.files[0]);
                }

                const response = await fetch('/api/publicaciones', {
                    method: 'POST',
                    headers: { 'X-Admin-Password': adminPassword },
                    body: formData
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'No se pudo guardar la publicación.');
                }

                document.getElementById(tituloId).value = "";
                document.getElementById(textoId).value = "";
                inputArchivo.value = "";

                alert("¡Publicación guardada con éxito en " + nombreSeccion.toUpperCase() + "!");

            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.textContent = original;
                btn.disabled = false;
            }
        }

        async function subirMultimedia(seccionDestino, idInputArchivo, idInputNombre, tipoMedio, eventRef) {
            let inputArchivo = document.getElementById(idInputArchivo);
            let nombreVal = document.getElementById(idInputNombre).value.trim();

            if (!inputArchivo.files || !inputArchivo.files[0]) {
                alert("Selecciona un archivo primero.");
                return;
            }

            const btn = eventRef.target;
            let original = btn.textContent;
            btn.textContent = "Subiendo al servidor...";
            btn.disabled = true;

            try {
                const file = inputArchivo.files[0];
                const formData = new FormData();
                formData.append('file', file);
                formData.append('titulo', nombreVal || 'Archivo sin título');
                formData.append('texto', '');
                formData.append('seccion', seccionDestino);

                const response = await fetch('/api/publicaciones', {
                    method: 'POST',
                    headers: { 'X-Admin-Password': adminPassword },
                    body: formData
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    inputArchivo.value = "";
                    document.getElementById(idInputNombre).value = "";
                    alert("¡Archivo guardado y añadido a " + seccionDestino.toUpperCase() + "!");
                } else {
                    throw new Error(result.error || 'No se pudo guardar el archivo.');
                }
            } catch (error) {
                alert("Fallo de subida: " + error.message);
            } finally {
                btn.textContent = original;
                btn.disabled = false;
            }
        }

        async function actualizarListaInicio() {
            let contenedor = document.getElementById('lista-admin-inicio');
            contenedor.innerHTML = '<p style="color: #64748b; font-size: 14px;">Cargando publicaciones...</p>';

            try {
                const response = await fetch('/api/publicaciones?seccion=inicio', { cache: 'no-store' });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'No se pudieron cargar las publicaciones.');
                }

                const noticias = result.publicaciones || [];
                if (noticias.length === 0) {
                    contenedor.innerHTML = '<p style="color: #64748b; font-size: 14px;">No hay publicaciones en el inicio.</p>';
                    return;
                }

                let html = '';
                noticias.forEach(function(item) {
                    html += `
                        <div class="item-lista">
                            <div>
                                <strong style="color: #1e3a8a;">${escaparHtmlAdmin(item.titulo || 'Sin título')}</strong>
                                <p style="margin: 4px 0 0; font-size: 13px; color: #475569;">${escaparHtmlAdmin(item.texto ? item.texto.substring(0, 60) + '...' : 'Solo contenido multimedia')}</p>
                            </div>
                            <button class="btn-eliminar" onclick="eliminarPublicacion(${item.id})">Eliminar</button>
                        </div>
                    `;
                });
                contenedor.innerHTML = html;
            } catch (error) {
                contenedor.innerHTML = '<p style="color: #b91c1c; font-size: 14px;">Error al cargar la lista.</p>';
            }
        }

        async function eliminarPublicacion(id) {
            if (!confirm("¿Estás seguro de que deseas eliminar esta publicación?")) return;

            try {
                const response = await fetch('/api/publicaciones/' + id, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Password': adminPassword }
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'No se pudo eliminar.');
                }
                alert("Publicación eliminada correctamente.");
                await actualizarListaInicio();
            } catch (error) {
                alert("Error al eliminar: " + error.message);
            }
        }
    </script>
</body>
</html>
